<text x="1166" y="293" font-size="19" fill="#E4ECE7" font-weight="400" text-anchor="start">Whole-result DAGs</text>
<text x="1166" y="323" font-size="19" fill="#E4ECE7" font-weight="400" text-anchor="start">Stat index / GC</text>
<rect x="1144" y="367" width="256" height="180" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
