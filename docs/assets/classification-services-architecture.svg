<text x="40" y="87" font-size="22" fill="#E4ECE7" font-weight="400" text-anchor="start">Every type content can be shown to be</text>
<text x="1400" y="53" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="end">LAYER ARCHITECTURE</text>
