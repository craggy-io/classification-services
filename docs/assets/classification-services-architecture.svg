<text x="414" y="263" font-size="19" fill="#E4ECE7" font-weight="400" text-anchor="start">Starlark + test()</text>
<rect x="392" y="307" width="303" height="120" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M414 329 H448" fill="none" stroke="#FFB547" stroke-width="3" />
