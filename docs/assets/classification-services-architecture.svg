<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="846" viewBox="0 0 1200 846" role="img" aria-labelledby="title desc">
<title id="title">Classification Services architecture</title>
<desc id="desc">Five tiers, each using the one below: the CLI and the artifact-services adapter use Classify; Classify uses the catalog, signatures and Starlark definitions; probes recognise formats using shared views; results and reads go through the workdir cache and the paged input.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="846" rx="20" fill="#111A20"/>
<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="53" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; CLASSIFICATION SERVICES</text>
<text x="40" y="87" font-size="20" fill="#93A39A" font-weight="400" text-anchor="start">Each tier uses the tier below it</text>
<path d="M40 111 H1160" fill="none" stroke="#2A2F2C" stroke-width="2"/>
<text x="40" y="193" font-size="17" fill="#FFB547" font-weight="700" text-anchor="start">USE</text>
<rect x="394" y="140" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="532" y="178" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">CLI</text>
<text x="532" y="208" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">craggy-classify</text>
<rect x="710" y="140" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="848" y="178" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Adapter</text>
<text x="848" y="208" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">artifact-services</text>
<path d="M690 236 V272" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="329" font-size="17" fill="#FFB547" font-weight="700" text-anchor="start">ENGINE</text>
<rect x="552" y="276" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="690" y="314" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Classify</text>
<text x="690" y="344" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">schedule, merge, derive</text>
<path d="M690 372 V408" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="465" font-size="17" fill="#FFB547" font-weight="700" text-anchor="start">KNOW</text>
<rect x="236" y="412" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="374" y="450" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Catalog</text>
<text x="374" y="480" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">type DAG</text>
<rect x="552" y="412" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="690" y="450" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Signatures</text>
<text x="690" y="480" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">byte magic</text>
<rect x="868" y="412" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="1006" y="450" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Definitions</text>
<text x="1006" y="480" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">Starlark modules</text>
<path d="M690 508 V544" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="601" font-size="17" fill="#FFB547" font-weight="700" text-anchor="start">RECOGNISE</text>
<rect x="394" y="548" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="532" y="586" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Probes</text>
<text x="532" y="616" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">native recognisers</text>
<rect x="710" y="548" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="848" y="586" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Views</text>
<text x="848" y="616" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">shared parsers</text>
<path d="M690 644 V680" fill="none" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="737" font-size="17" fill="#FFB547" font-weight="700" text-anchor="start">STORE</text>
<rect x="394" y="684" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="532" y="722" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Cache</text>
<text x="532" y="752" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">results in the workdir</text>
<rect x="710" y="684" width="276" height="92" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<text x="848" y="722" font-size="22" fill="#E4ECE7" font-weight="700" text-anchor="middle">Paged input</text>
<text x="848" y="752" font-size="16" fill="#93A39A" font-weight="400" text-anchor="middle">budgeted reads</text>
<text x="40" y="814" font-size="16" fill="#93A39A" font-weight="400" text-anchor="start">Shared by every tier: evidence levels (candidate &lt; recognised &lt; validated) and anomalies.</text>
</g></svg>
