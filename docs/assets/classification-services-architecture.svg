<text x="62" y="293" font-size="19" fill="#E4ECE7" font-weight="400" text-anchor="start">Explain / anomalies</text>
<text x="62" y="323" font-size="19" fill="#E4ECE7" font-weight="400" text-anchor="start">Check / Define</text>
<text x="62" y="353" font-size="19" fill="#E4ECE7" font-weight="400" text-anchor="start">Batch / CLI</text>
<text x="392" y="145" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">02 / DEFINITIONS</text>
<rect x="392" y="167" width="303" height="120" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
