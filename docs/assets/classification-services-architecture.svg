<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Classification Services layer architecture</title>
<desc id="desc">Classify (engine and results) uses Definitions (Starlark modules), the Catalog type DAG and Signatures, runs Probes over shared Views, and caches in the workdir through the paged reader and cache. The evidence vocabulary (levels and anomalies) spans every layer. An optional adapter module connects to artifact-services.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="760" rx="20" fill="#111A20"/>
<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
